<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow — Modern Task Management</title>
<meta name="description" content="TaskFlow: a modern, aesthetic task management dashboard built with Spring Boot.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Loading Screen -->
<div class="loader" id="loader">
  <div class="loader-logo">
    <span class="loader-dot"></span>
    <span class="loader-dot"></span>
    <span class="loader-dot"></span>
  </div>
</div>

<!-- Animated background blobs -->
<div class="bg-blobs" aria-hidden="true">
  <span class="blob blob-1"></span>
  <span class="blob blob-2"></span>
  <span class="blob blob-3"></span>
</div>

<div class="app-shell">

  <!-- Top Navigation -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M9 12.5l2 2 4-4.5M12 3l7 3v6c0 4.5-3 8-7 9-4-1-7-4.5-7-9V6l7-3z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <span class="brand-name">TaskFlow</span>
    </div>

    <div class="topbar-actions">
      <button class="icon-btn" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4.2" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
      <button class="btn btn-primary" id="openAddModal">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        New Task
      </button>
    </div>
  </header>

  <main class="content">

    <!-- Hero -->
    <section class="hero">
      <h1>Welcome back 👋</h1>
      <p>Here's what's happening with your tasks today.</p>
    </section>

    <!-- Stats Cards -->
    <section class="stats-grid" id="statsGrid">
      <div class="stat-card stat-total">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M8 10h8M8 14h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </div>
        <div class="stat-info">
          <span class="stat-value" id="statTotal">0</span>
          <span class="stat-label">Total Tasks</span>
        </div>
      </div>
      <div class="stat-card stat-progress">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3.5 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </div>
        <div class="stat-info">
          <span class="stat-value" id="statProgress">0</span>
          <span class="stat-label">In Progress</span>
        </div>
      </div>
      <div class="stat-card stat-pending">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 8v4l3 1.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.8"/></svg>
        </div>
        <div class="stat-info">
          <span class="stat-value" id="statPending">0</span>
          <span class="stat-label">Pending</span>
        </div>
      </div>
      <div class="stat-card stat-done">
        <div class="stat-icon">
          <svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="stat-info">
          <span class="stat-value" id="statDone">0</span>
          <span class="stat-label">Completed</span>
        </div>
      </div>
    </section>

    <!-- Main Grid: Task board + side panel -->
    <section class="main-grid">

      <!-- Task Board -->
      <div class="panel task-panel">
        <div class="panel-header">
          <div class="tabs" id="filterTabs">
            <button class="tab active" data-filter="ALL">All</button>
            <button class="tab" data-filter="PENDING">Pending</button>
            <button class="tab" data-filter="IN_PROGRESS">In Progress</button>
            <button class="tab" data-filter="COMPLETED">Completed</button>
          </div>
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <input type="text" id="searchInput" placeholder="Search tasks...">
          </div>
        </div>

        <div class="task-list" id="taskList">
          <!-- Task cards injected by JS -->
        </div>

        <div class="empty-state" id="emptyState" hidden>
          <svg viewBox="0 0 24 24" fill="none"><path d="M9 12.5l2 2 4-4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="3.5" y="4.5" width="17" height="15" rx="3" stroke="currentColor" stroke-width="1.8"/></svg>
          <p>No tasks found</p>
          <span>Try adjusting your filters or add a new task</span>
        </div>
      </div>

      <!-- Side Panel -->
      <aside class="panel side-panel">
        <h3>Priority Breakdown</h3>
        <div class="chart-wrap">
          <canvas id="priorityChart" height="200"></canvas>
        </div>

        <div class="legend" id="chartLegend"></div>

        <div class="progress-block">
          <div class="progress-header">
            <span>Overall Completion</span>
            <span id="progressPercent">0%</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>
      </aside>

    </section>
  </main>
</div>

<!-- Add / Edit Task Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">New Task</h2>
      <button class="icon-btn" id="closeModal">
        <svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <form id="taskForm">
      <input type="hidden" id="taskId">
      <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" required placeholder="e.g. Design new onboarding flow">
      </div>
      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" rows="3" placeholder="Add more details..."></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="priority">Priority</label>
          <select id="priority">
            <option value="LOW">Low</option>
            <option value="MEDIUM" selected>Medium</option>
            <option value="HIGH">High</option>
          </select>
        </div>
        <div class="form-group">
          <label for="dueDate">Due Date</label>
          <input type="date" id="dueDate">
        </div>
      </div>
      <div class="form-group">
        <label for="status">Status</label>
        <select id="status">
          <option value="PENDING">Pending</option>
          <option value="IN_PROGRESS">In Progress</option>
          <option value="COMPLETED">Completed</option>
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">Save Task</button>
      </div>
    </form>
  </div>
</div>

<!-- Toast container -->
<div class="toast-container" id="toastContainer"></div>

<script src="js/app.js"></script>
</body>
</html>
