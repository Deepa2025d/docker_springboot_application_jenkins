---
apiVersion: v1
kind: Namespace

metadata:
  name: prod

---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: webapp
  namespace: prod

spec:
  replicas: 2

  selector:
    matchLabels:
      app: webapp

  template:
    metadata:
      labels:
        app: webapp

    spec:
      containers:
      - name: webapp
        image: nginx
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service

metadata:
  name: webapp-service
  namespace: prod

spec:
  type: NodePort

  selector:
    app: webapp

  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080

---
apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: mysql
  namespace: prod

spec:
  serviceName: mysql-service
  replicas: 2

  selector:
    matchLabels:
      app: mysql

  template:
    metadata:
      labels:
        app: mysql

    spec:
      containers:
      - name: mysql
        image: mysql:8.0

        ports:
        - containerPort: 3306

        env:
        - name: MYSQL_ROOT_PASSWORD
          value: root123

---
apiVersion: v1
kind: Service

metadata:
  name: mysql-service
  namespace: prod

spec:
  clusterIP: None

  selector:
    app: mysql

  ports:
  - port: 3306
    targetPort: 3306
